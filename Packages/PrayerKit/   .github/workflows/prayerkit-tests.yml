name: PrayerKit Tests

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Swift sürümünü göster
        run: swift --version

      - name: PrayerKit testlerini çalıştır
        working-directory: Packages/PrayerKit
        run: swift test --verbose
