name: NamazWidgets Build

on:
  push:
    paths:
      - "Packages/NamazWidgets/**"
      - "Packages/NamazCore/**"
      - "Packages/PrayerKit/Sources/**"
      - ".github/workflows/namazwidgets-build.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Araç sürümleri
        run: |
          swift --version
          xcodebuild -version

      - name: iOS için derle
        working-directory: Packages/NamazWidgets
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme NamazWidgets \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tail -60
