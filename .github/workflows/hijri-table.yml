name: Hicri Düzeltme Tablosu

# Diyanet ayna arşivindeki `HicriTarihUzun` alanlarından, Diyanet takviminin Ümmü'l-Kura'dan
# ayrıldığı günlerin tablosunu üretir ve değişiklik varsa commit'ler.
#
# Araç, veriyi anlamadığı her durumda (ayrıştırılamayan ay adı, ilçeler arası uyuşmazlık)
# kırmızı bitiyor ve dosyayı hiç yazmıyor. Anlaşılmayan veriden tablo üretmek, uydurmakla
# aynı kapıya çıkardı.

on:
  workflow_dispatch:
  push:
    paths:
      - "Reference/diyanet/mirror/**"
      - "Packages/PrayerKit/Sources/PrayerKitHijriTable/**"
      - "Packages/PrayerKit/Sources/PrayerKit/Hijri/**"
      - ".github/workflows/hijri-table.yml"

permissions:
  contents: write

concurrency:
  # HER İŞ AKIŞI KENDİ GRUBUNDA.
  #
  # Bir ara dördünü birden `repo-write` adlı ortak bir gruba almıştım; amaç aynı anda iki
  # push denemesini engellemekti. Ters tepti: GitHub bir grupta yalnızca BİR çalışan ve BİR
  # bekleyen tutuyor, üçüncü ve sonrakiler sıraya girmek yerine iptal ediliyor. Tek bir
  # push dört iş akışını birden tetiklediği için ikisi hep "Cancelling since a higher
  # priority waiting request exists" diye düşüyordu.
  #
  # Push yarışının gerçek çözümü aşağıdaki rebase-retry döngüsü; o zaten çalışıyor.
  group: hijri-table
  cancel-in-progress: false

jobs:
  generate:
    runs-on: macos-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Swift sürümü
        run: swift --version

      - name: Tabloyu üret
        working-directory: Packages/PrayerKit
        run: swift run -c release prayerkit-hijri-table "$GITHUB_WORKSPACE"

      - name: Raporu özet olarak göster
        if: always()
        run: cat Reference/diyanet/hijri-report.md >> "$GITHUB_STEP_SUMMARY" || true

      # Üretilen tablo testlerden geçmeden commit'lenmesin: bozuk bir tabloyu depoya
      # yazmaktansa iş akışının kırmızı bitmesi yeğdir.
      - name: PrayerKit testleri
        working-directory: Packages/PrayerKit
        run: swift test

      - name: Tabloyu commit'le
        run: |
          FILES="Packages/PrayerKit/Sources/PrayerKit/Hijri/DiyanetHijriOverrides.swift Reference/diyanet/hijri-report.md"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "Tablo değişmedi, commit atlanıyor."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Hicri düzeltme tablosu güncellendi"
          # Aynı push birden fazla iş akışını tetikleyip her biri commit atabiliyor.
          # `actions/checkout` tetikleyen commit'i alıyor, dolayısıyla ilk push geçtiğinde
          # bizim dalımız geride kalıyor ve push "fetch first" diye reddediliyor. Farklı
          # dosyalara dokunduğumuz için rebase temiz geçiyor; üç deneme fazlasıyla yeter.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push reddedildi (deneme $attempt), rebase edilip tekrar denenecek."
            git fetch origin "$GITHUB_REF_NAME" || exit 1
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
          done
          echo "Push üç denemede de başarısız oldu."
          exit 1
