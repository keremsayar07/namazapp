name: NamazCore Tests

on:
  push:
    paths:
      - "Packages/NamazCore/**"
      - "Packages/PrayerKit/Sources/**"
      - ".github/workflows/namazcore-tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Swift sürümü
        run: swift --version

      - name: Build
        working-directory: Packages/NamazCore
        run: swift build -v

      - name: Run tests
        working-directory: Packages/NamazCore
        run: swift test -v
