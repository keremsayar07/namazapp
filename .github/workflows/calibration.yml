name: Kalibrasyon Raporu

# PrayerKit'in hesapladığı vakitleri Diyanet referans verisiyle karşılaştırıp
# Reference/diyanet/calibration-report.md dosyasını üretir ve commit'ler.
#
# Gerçek Swift kodunu gerçek Apple toolchain'inde çalıştırıyor: raporlanan fark,
# uygulamanın gerçekten üreteceği fark.

on:
  workflow_dispatch:
  push:
    paths:
      - "Reference/diyanet/mirror/**"
      - "Packages/PrayerKit/Sources/**"
      - ".github/workflows/calibration.yml"

permissions:
  contents: write

concurrency:
  # HER İŞ AKIŞI KENDİ GRUBUNDA.
  #
  # Bir ara dördünü birden `repo-write` adlı ortak bir gruba almıştım; amaç aynı anda iki
  # push denemesini engellemekti. Ters tepti: GitHub bir grupta yalnızca BİR çalışan ve BİR
  # bekleyen tutuyor, üçüncü ve sonrakiler sıraya girmek yerine iptal ediliyor. Tek bir
  # push dört iş akışını birden tetiklediği için ikisi hep "Cancelling since a higher
  # priority waiting request exists" diye düşüyordu.
  #
  # Push yarışının gerçek çözümü aşağıdaki rebase-retry döngüsü; o zaten çalışıyor.
  group: calibration
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: macos-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Swift sürümü
        run: swift --version

      - name: Kalibrasyon aracını çalıştır
        working-directory: Packages/PrayerKit
        run: swift run -c release prayerkit-calibrate "$GITHUB_WORKSPACE"

      # Araç tolerans aşımında kırmızı bitiyor. Raporun yine de görünmesini ve
      # commit'lenmesini istiyoruz — neyin bozulduğu repoda kalsın.
      - name: Raporu özet olarak göster
        if: always()
        run: cat Reference/diyanet/calibration-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Raporu commit'le
        if: always()
        run: |
          REPORT=Reference/diyanet/calibration-report.md
          if [ -z "$(git status --porcelain $REPORT)" ]; then
            echo "Rapor değişmedi, commit atlanıyor."
            exit 0
          fi
          # Rapor her koşuda üretim zaman damgasını yeniliyor. Yalnızca o satır değiştiyse
          # commit atmak, hiçbir bilgi taşımayan bir geçmiş üretir — ve depoya yazan her
          # koşuyu diğer iş akışlarıyla push yarışına sokar. Değişikliği geri alıp çıkıyoruz.
          # `|| true` şart: hiçbir satır eşleşmezse grep 1 döner ve `set -e -o pipefail`
          # altında adım hata verirdi. Zaman damgası satırı ASCII bir kalıpla ayıklanıyor
          # (koşucudaki bash 3.2 `$'\uXXXX'` kaçışlarını anlamıyor).
          SUBSTANTIVE=$(git diff -U0 -- "$REPORT" \
            | grep -E '^[+-]' \
            | grep -Ev '^(\+\+\+|---)' \
            | grep -Ev '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z' \
            || true)
          if [ -z "$SUBSTANTIVE" ]; then
            echo "Yalnızca zaman damgası değişti, commit atlanıyor."
            git checkout -- "$REPORT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "Kalibrasyon raporu güncellendi"
          # Aynı push birden fazla iş akışını tetikleyip her biri commit atabiliyor.
          # `actions/checkout` tetikleyen commit'i alıyor, dolayısıyla ilk push geçtiğinde
          # bizim dalımız geride kalıyor ve push "fetch first" diye reddediliyor. Farklı
          # dosyalara dokunduğumuz için rebase temiz geçiyor; üç deneme fazlasıyla yeter.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push reddedildi (deneme $attempt), rebase edilip tekrar denenecek."
            git fetch origin "$GITHUB_REF_NAME" || exit 1
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
          done
          echo "Push üç denemede de başarısız oldu."
          exit 1
