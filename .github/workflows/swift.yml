name: PrayerKit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift sürümü
        run: swift --version
      - name: Build
        working-directory: Packages/PrayerKit
        run: swift build -v
      - name: Run tests
        working-directory: Packages/PrayerKit
        run: swift test -v
