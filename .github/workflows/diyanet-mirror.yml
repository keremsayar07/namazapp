name: Diyanet Vakitleri (ayna)

# Diyanet'in vakitlerini yeniden yayımlayan açık ayna üzerinden referans verisi toplar.
# Kimlik bilgisi gerektirmez, kotası yoktur — bu yüzden bugün çalışabilir.
#
# Ayna kayan ~31 günlük bir pencere döndürüyor; iş haftada iki kez çalışarak yeni günleri
# arşive ekler. Arşiv yalnızca büyür: aynı gün için kayıt varsa üzerine yazılmaz, fark
# varsa "ÇAKIŞMA" olarak log'a düşer.
#
# NOT: Bu veri birincil kaynak değildir. Reference/diyanet/mirror/PROVENANCE.md içindeki
# doğrulama adımı tamamlanmadan bu veriden üretilen fixture'lar "Diyanet doğrulamalı"
# sayılmaz.

on:
  schedule:
    - cron: "0 5 * * 1,4"
  workflow_dispatch:
  # Kendi bilgisayarınızdan toplayıp Reference/diyanet/raw/ altına yüklediğiniz ham
  # dökümler, yüklenir yüklenmez arşive işlensin diye.
  push:
    paths:
      - "Reference/diyanet/raw/**"

permissions:
  contents: write

concurrency:
  # Depoya yazan tüm iş akışları tek grupta: aynı anda ikisi push etmeye
  # çalışmasın. İptal etmiyoruz, sıraya giriyorlar.
  group: repo-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vakitleri topla
        run: python3 Tools/diyanet_reference/fetch_mirror.py

      - name: Değişiklikleri commit'le
        run: |
          if [ -z "$(git status --porcelain Reference/)" ]; then
            echo "Yeni gün yok, commit atlanıyor."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Reference/
          git commit -m "Diyanet vakitleri (ayna): yeni günler eklendi"
          # Aynı push birden fazla iş akışını tetikleyip her biri commit atabiliyor.
          # `actions/checkout` tetikleyen commit'i alıyor, dolayısıyla ilk push geçtiğinde
          # bizim dalımız geride kalıyor ve push "fetch first" diye reddediliyor. Farklı
          # dosyalara dokunduğumuz için rebase temiz geçiyor; üç deneme fazlasıyla yeter.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push reddedildi (deneme $attempt), rebase edilip tekrar denenecek."
            git fetch origin "$GITHUB_REF_NAME" || exit 1
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
          done
          echo "Push üç denemede de başarısız oldu."
          exit 1
