name: Uygulama Derlemesi

# Bugüne kadar CI yalnızca PAKETLERİ doğruluyordu. Uygulama hedefi ile widget uzantısının
# birleşimi — Info.plist, entitlements, App Group, gömme (embedding), varlık kataloğu —
# hiç sınanmamıştı. Bu iş akışı `project.yml`'den projeyi üretip ikisini birlikte derliyor.
#
# Neyi doğrular: proje üretilebiliyor, tüm hedefler derleniyor, uzantı uygulamaya
# gömülüyor, plist ve entitlements dosyaları geçerli, ikon kataloğu okunuyor.
#
# Neyi DOĞRULAMAZ: imzalama, gerçek App Group konteynerine erişim, bildirim izinleri,
# widget'ın ana ekranda gerçekten veri göstermesi. Bunlar yalnızca cihazda görülür —
# Faz 8b'nin işi.

on:
  push:
    paths:
      - "App/**"
      - "WidgetExtension/**"
      - "Packages/**"
      - "project.yml"
      - ".github/workflows/app-build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # HER İŞ AKIŞI KENDİ GRUBUNDA.
  #
  # Bir ara dördünü birden `repo-write` adlı ortak bir gruba almıştım; amaç aynı anda iki
  # push denemesini engellemekti. Ters tepti: GitHub bir grupta yalnızca BİR çalışan ve BİR
  # bekleyen tutuyor, üçüncü ve sonrakiler sıraya girmek yerine iptal ediliyor. Tek bir
  # push dört iş akışını birden tetiklediği için ikisi hep "Cancelling since a higher
  # priority waiting request exists" diye düşüyordu.
  #
  # Push yarışının gerçek çözümü aşağıdaki rebase-retry döngüsü; o zaten çalışıyor.
  group: app-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Araç sürümleri
        run: |
          swift --version
          xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Projeyi üret
        run: xcodegen generate --spec project.yml

      - name: Üretilen yapıyı göster
        run: |
          xcodebuild -list -project Namaz.xcodeproj

      # Çıktı dosyaya alınıyor, ekrana yalnızca işe yarayan kısım basılıyor.
      # `| tail -80` yeterli değildi: xcodebuild hata satırlarını uzun bir özetin ortasına
      # gömebiliyor ve kuyruk onları kesiyor. Önce hataları, sonra kuyruğu yazıyoruz.
      - name: iOS için derle
        run: |
          if xcodebuild build \
              -project Namaz.xcodeproj \
              -scheme Namaz \
              -destination 'generic/platform=iOS' \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            echo "Derleme başarılı."
            exit 0
          fi
          echo "================ HATA SATIRLARI ================"
          grep -E "error:|error " build.log | head -40 || echo "(grep bir şey bulamadı)"
          echo "================ SON 150 SATIR ================="
          tail -150 build.log
          exit 1

      # Hata satırları ekrandan kayarsa diye tam günlük indirilebilir kalsın.
      - name: Derleme günlüğünü sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      # App Group kimliği üç yerde geçiyor: iki entitlements dosyası ve PrayerKit'teki
      # `AppGroup.identifier`. Üçü birebir aynı olmazsa widget çöker değil — sessizce boş
      # kalır. Sessiz hatalar en pahalı hatalardır, o yüzden burada açıkça kontrol ediliyor.
      # Bu sefer bunu elle bulmak üç tur sürdü: uzantının ürün adı bir paketin modül
      # adıyla aynıydı, ikisi aynı dosyaya yazmaya çalıştı ve Xcode tek bir `error:`
      # satırı bile basmadan derlemeyi kuramadı. Bir daha aynı tuzağa düşmeyelim.
      - name: Ürün adları paket adlarıyla çakışıyor mu
        if: always()
        run: |
          PACKAGES=$(ls Packages)
          CLASH=0
          for name in $PACKAGES; do
            if grep -qE "PRODUCT_NAME: +$name\s*$" project.yml; then
              echo "HATA: '$name' hem paket modülü hem de bir hedefin PRODUCT_NAME değeri."
              CLASH=1
            fi
          done
          if [ "$CLASH" = "1" ]; then
            echo "Aynı ada sahip iki üretici aynı .swiftmodule yoluna yazar ve derleme kurulamaz."
            exit 1
          fi
          echo "Çakışma yok."

      - name: App Group kimliği tutarlı mı
        run: |
          SWIFT_ID=$(grep -oE 'group\.[a-zA-Z0-9._-]+' \
            Packages/PrayerKit/Sources/PrayerKit/SharedStore/PrayerTimesSnapshot.swift | head -1)
          APP_ID=$(grep -oE 'group\.[a-zA-Z0-9._-]+' App/Namaz.entitlements | head -1)
          WIDGET_ID=$(grep -oE 'group\.[a-zA-Z0-9._-]+' WidgetExtension/NamazWidgets.entitlements | head -1)
          echo "PrayerKit : $SWIFT_ID"
          echo "Uygulama  : $APP_ID"
          echo "Widget    : $WIDGET_ID"
          if [ -z "$SWIFT_ID" ] || [ "$SWIFT_ID" != "$APP_ID" ] || [ "$SWIFT_ID" != "$WIDGET_ID" ]; then
            echo "HATA: App Group kimlikleri birbirini tutmuyor."
            exit 1
          fi
          echo "Üçü de aynı."

      # Üretilen projeyi depoya yazıyoruz. Sebebi tek: Mac'te hiçbir şey kurmaya gerek
      # kalmasın. Kullanıcı depoyu indirip `Namaz.xcodeproj` dosyasını çift tıklıyor,
      # bitti. Sapma riski yok — dosyayı kimse elle düzenlemiyor, her değişiklikte burada
      # yeniden üretiliyor.
      #
      # Yalnızca push'ta commit'liyoruz; pull request'te üretip derleyip bırakıyoruz.
      - name: Projeyi commit'le
        if: github.event_name == 'push'
        run: |
          FILES="Namaz.xcodeproj App/Info.plist App/Namaz.entitlements \
                 WidgetExtension/Info.plist WidgetExtension/NamazWidgets.entitlements"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "Proje değişmedi, commit atlanıyor."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Xcode projesi yeniden üretildi"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push reddedildi (deneme $attempt), rebase edilip tekrar denenecek."
            git fetch origin "$GITHUB_REF_NAME" || exit 1
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
          done
          echo "Push üç denemede de başarısız oldu."
          exit 1
